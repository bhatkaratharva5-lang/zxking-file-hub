
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1a">
  <title>Download File | ZXKING</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #14254a, #080d1a 65%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .brand {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .brand span {
      color: #42d9ff;
    }

    .subtitle {
      text-align: center;
      color: #aab8d3;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(18, 29, 52, 0.95);
      border: 1px solid #263b63;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }

    .file-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 12px;
      overflow-wrap: anywhere;
    }

    .file-info {
      color: #aab8d3;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .banner {
      margin-top: 22px;
      min-height: 90px;
      border: 1px dashed #536787;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: #9aabc7;
      font-size: 13px;
      text-align: center;
    }

    .status {
      margin-top: 18px;
      color: #aab8d3;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: #71819e;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">ZX<span>KING</span></div>
    <div class="subtitle">Your file download hub</div>

    <section class="card">
      <div class="file-icon">📁</div>

      <h1 id="filename">Loading file...</h1>
      <div class="file-info" id="filesize">Please wait</div>

      <a id="download-button" class="download-btn" href="#" hidden>
        ⬇ Download File
      </a>

      <div class="banner">
        📢 Banner advertisement space<br>
        Ads can be added here later
      </div>

      <div class="status" id="status">
        Fetching file information...
      </div>
    </section>

    <footer>
      Powered by ZXKING File Hub
    </footer>
  </main>

  <script>
    (() => {
      const filenameEl = document.getElementById("filename");
      const filesizeEl = document.getElementById("filesize");
      const downloadButton = document.getElementById("download-button");
      const statusEl = document.getElementById("status");

      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) {
          return (bytes / 1024).toFixed(1) + " KB";
        }
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      async function loadFile() {
        const id = new URLSearchParams(window.location.search).get("id");

        const uuidPattern =
          /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

        if (!id || !uuidPattern.test(id)) {
          filenameEl.textContent = "Invalid file link";
          filesizeEl.textContent = "";
          statusEl.textContent = "This download link is not valid.";
          return;
        }

        try {
          const response = await fetch(
            `/api/file-info/${encodeURIComponent(id)}`
          );

          if (!response.ok) {
            throw new Error(
              response.status === 404
                ? "File not found."
                : "Unable to load file information."
            );
          }

          const file = await response.json();

          filenameEl.textContent = file.filename;
          filesizeEl.textContent = formatBytes(file.size_bytes);

          downloadButton.href =
            `/api/download/${encodeURIComponent(id)}`;

          downloadButton.hidden = false;

          statusEl.textContent = "Your file is ready to download.";
        } catch (error) {
          filenameEl.textContent = "Download unavailable";
          filesizeEl.textContent = "";
          statusEl.textContent = error.message;
        }
      }

      loadFile();
    })();
  </script>
</body>
</html>
